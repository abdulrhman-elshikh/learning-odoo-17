services:

  db:
    image: postgres:15
    container_name: db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - odoo-db-pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres_network

  odoo:
    build: ./config/.
    container_name: odoo
    tty: true
    depends_on:
      - db
    ports:
      - "8069:8069"
    restart: always
    command: "-d learning_db"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - type: bind
        source: ./addons
        target: /mnt/extra-addons
    environment:
      - HOST=db
      - USER=admin
      - PASSWORD=admin
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

volumes:
  odoo-web-data:
  odoo-db-data:
  odoo-db-pgdata:
  pgadmin_data:

networks:
  postgres_network:
    driver: bridge

