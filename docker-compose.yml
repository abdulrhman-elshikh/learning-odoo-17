version: "3.1"
services:
  odoo:
    image: odoo:17
    container_name: odoo17Learning
    depends_on:
      - db
    ports:
      - "8069:8069"
    restart: always
    command: "-d learning_db"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - type: bind
        source: ./addons
        target: /mnt/extra-addons
    environment:
      - HOST=db
      - USER=admin
      - PASSWORD=admin
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 512M

  db:
    image: postgres:15
    container_name: postgres_odoo17Learning
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - odoo-db-pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M

volumes:
  odoo-web-data:
  odoo-db-data:
  odoo-db-pgdata:
